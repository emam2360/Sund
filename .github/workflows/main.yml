name: Build Sundarban Drug House APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install -D typescript

      - name: Install Capacitor Android
        run: npm install @capacitor/android@8.5.2

      # Backup File খুঁজুন বাটন নিশ্চিত করা
      - name: Fix Backup File selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("script1.js")
          s = p.read_text(encoding="utf-8")

          old = '<label class="btn secondary">Restore<input type="file" accept=".json" hidden onchange="restoreBackup(this.files[0])"></label>'

          new = '<button class="btn secondary" onclick="selectBackupFile()">📂 Backup File খুঁজুন</button>'

          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          print("Backup File selector checked/fixed.")

          PY

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Android native bridge
        shell: bash
        run: |
          set -e

          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi

          PACKAGE_PATH=$(dirname "$MAIN_ACTIVITY" | sed 's#android/app/src/main/java/##')
          PACKAGE_NAME=$(echo "$PACKAGE_PATH" | tr '/' '.')

          cat > "$MAIN_ACTIVITY" <<EOF
          package $PACKAGE_NAME;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import androidx.appcompat.app.AlertDialog;

          import com.getcapacitor.BridgeActivity;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {

              private static final int FOLDER_REQUEST = 9017;
